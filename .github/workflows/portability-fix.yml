name: Apply verified text portability correction
on:
  push:
    branches: [main]
    paths: ['.github/workflows/portability-fix.yml']
permissions:
  contents: write
jobs:
  correct:
    if: ${{ github.repository == 'classworkneet-rgb/healthcare-chatbots-reproducibility' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Apply exact audited code-only changes
        shell: bash
        run: |
          python -B -S - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path.cwd()
          (root/'build').mkdir(exist_ok=True)
          before = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest() for directory in ['01_data', '04_outputs'] for p in (root/directory).rglob('*') if p.is_file()}
          (root/'build/data_before.json').write_text(json.dumps(before), encoding='utf-8')
          expected = {
              'build_workbook.py': '85d73dfa2adb59bf3b764b5fbf91498bc4454a12dcea439bf0f777913e8e7cdb',
              'reproduce.py': '72aff7417cf2b5f359e4650f81dd00a8459f339005aaf6d82e3c41247b02673b',
              'test_analysis.py': 'cd723be067e87fa71b8c83c5cb1c5c3bf78ccc7169514e5aabc2684779d46c01',
              'test_release.py': '5faeed65986e038f452ec88ac9474a51c584c740bd8afce2830da9807f4d3590',
              'test_repository.py': '178fc8061d5d3440dc398f46867c9f23a56b86d08bd90b26db35b6d6e94ef714',
              'update_manifest.py': '6da12b7cfcf5f01d051833e615e2641492777c4192cb10c4402ac25112451312',
              'workbook_model.py': 'fd9589162028c49530167d5947f894d740491c7eef221db3033aa8e68ca807fa'
          }
          tests = '\n'.join([
              '    def test_results_json_uses_canonical_lf(self):',
              "        data=(ROOT/'04_outputs/results.json').read_bytes()",
              "        self.assertNotIn(b'\\r',data)",
              "        self.assertIsInstance(json.loads(data.decode('utf-8')),dict)",
              '    def test_validation_report_uses_canonical_lf(self):',
              "        data=(ROOT/'04_outputs/validation_report.txt').read_bytes()",
              "        self.assertNotIn(b'\\r',data)",
              "        self.assertIn('ANALYTICAL REPRODUCTION: PASS',data.decode('utf-8'))",
              ''
          ])
          for name, target_hash in expected.items():
              path = root/'03_code'/name
              text = path.read_text(encoding='utf-8')
              if name == 'test_repository.py':
                  assert 'def test_results_json_uses_canonical_lf' not in text
                  text = text.replace('    def test_manifest_paths_safe(self):', tests + '    def test_manifest_paths_safe(self):')
              text = text.replace('.read_text()', ".read_text(encoding='utf-8')")
              if name in {'reproduce.py', 'update_manifest.py'}:
                  text = text.replace(",encoding='utf-8')", ",encoding='utf-8',newline='\\n')")
              data = text.encode('utf-8')
              assert hashlib.sha256(data).hexdigest() == target_hash, name + ': patch differs from audited local version'
              path.write_bytes(data)
          (root/'.github/workflows/portability-fix.yml').unlink()
          print('Seven code files match the audited local patch. No scientific values changed.')
          PY
      - name: Regenerate reviewed manifests and run complete checks
        shell: bash
        run: |
          python -B -S 03_code/update_manifest.py --confirm-reviewed-changes
          python -B -S check_reproduction.py
          python -B -S - <<'PY'
          import hashlib, json
          from pathlib import Path
          before = json.loads(Path('build/data_before.json').read_text(encoding='utf-8'))
          assert all(hashlib.sha256(Path(name).read_bytes()).hexdigest() == value for name, value in before.items())
          assert hashlib.sha256(Path('MANIFEST.json').read_bytes()).hexdigest() == '1bfbb36f789493cde6bac394d548d9df66c57b892b87c8eef720ed3f5d90e305'
          assert hashlib.sha256(Path('SHA256SUMS.txt').read_bytes()).hexdigest() == 'e652ed58abd2288c87f7ee0f3d644d8165ee7d204849b734592b5dcfbac34257'
          print('All 29 data/workbook/output files unchanged; manifests match audited local build.')
          PY
      - name: Commit code and manifests only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 03_code/build_workbook.py 03_code/reproduce.py 03_code/test_analysis.py 03_code/test_release.py 03_code/test_repository.py 03_code/update_manifest.py 03_code/workbook_model.py MANIFEST.json SHA256SUMS.txt
          git commit -m 'Fix cross-platform UTF-8 and LF serialization; preserve all scientific data and outputs'
          git push origin HEAD:main
